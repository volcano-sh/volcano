name: E2E Hypernode

on:
  workflow_call:

permissions: read-all

jobs:
  e2e_hypernode:
    runs-on: ubuntu-24.04
    name: E2E about Hypernode (${{ matrix.name }})
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: controller-manager
            mode: controller-manager
            profile: full
          - name: standalone
            mode: standalone
            profile: full
          - name: ownership-transition
            mode: controller-manager
            profile: ownership-transition
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 1.26.x
      
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
      
      - name: Install dependencies
        run: |
          GO111MODULE="on" go install sigs.k8s.io/kind@v0.32.0
          curl -LO https://dl.k8s.io/release/v1.36.1/bin/linux/amd64/kubectl && sudo install kubectl /usr/local/bin/kubectl

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Download Images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: volcano-images
          path: _output/images

      - name: Load Images
        run: |
          make load-images

      - name: Run E2E Tests
        env:
          HYPERNODE_CONTROLLER_MODE: ${{ matrix.mode }}
          HYPERNODE_E2E_PROFILE: ${{ matrix.profile }}
        run: |
          export ARTIFACTS_PATH=${{ github.workspace }}/e2e-hypernode-logs
          make e2e-test-hypernode FORCE_REBUILD=false

      - name: Upload e2e hypernode logs
        if: '!success()'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: volcano_e2e_hypernode_${{ matrix.name }}_logs
          path: ${{ github.workspace }}/e2e-hypernode-logs
