name: Feature-gated E2E

on:
  workflow_call:
    inputs:
      suite_name:
        description: Display name of the E2E suite.
        required: true
        type: string
      make_target:
        description: Make target that enables the feature gates and runs the suite.
        required: true
        type: string
      artifact_name:
        description: Name of the uploaded failure-log artifact.
        required: true
        type: string
      log_directory:
        description: Workspace-relative directory used for E2E artifacts.
        required: true
        type: string

permissions: read-all

jobs:
  e2e:
    runs-on: ubuntu-24.04
    name: ${{ inputs.suite_name }}
    timeout-minutes: 40
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 1.26.x

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Install dependencies
        run: |
          GO111MODULE="on" go install sigs.k8s.io/kind@v0.32.0
          curl -LO https://dl.k8s.io/release/v1.36.1/bin/linux/amd64/kubectl
          sudo install kubectl /usr/local/bin/kubectl

      - name: Download Images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: volcano-images
          path: _output/images

      - name: Load Images
        run: make load-images

      - name: Run E2E Tests
        env:
          ARTIFACTS_PATH: ${{ github.workspace }}/${{ inputs.log_directory }}
        run: make ${{ inputs.make_target }} FORCE_REBUILD=false

      - name: Upload E2E logs
        if: '!success()'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ github.workspace }}/${{ inputs.log_directory }}
