<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1255" viewBox="0 0 1220 1255" role="img" aria-labelledby="title desc">
<title id="title">SubJob diagnostics collected into a Job result</title><desc id="desc">For each Job HyperNode, allocateForJob evaluates its SubJobs. Each SubJob candidate creates its own candidateDiagnostics, populated during task allocation. The SubJob returns the selected record or the combined completed failures. The Job combines the evaluated SubJob results, saves the Job candidate diagnostic with its statement, and selects or combines Job candidates. allocateResourcesForQueues applies the final result after commit, Pipeline or rollback.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#596777"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;font-size:20px;fill:#253441}.title{font-size:21px;font-weight:600}.code{font-family:"DejaVu Sans Mono",monospace;font-size:18px}.blue{fill:#315a7b}.orange{fill:#985927}.muted{fill:#596777}.number{font-size:22px;font-weight:600;fill:white}</style>
