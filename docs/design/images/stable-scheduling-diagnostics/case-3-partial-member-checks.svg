<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950" role="img" aria-labelledby="title desc">
<title id="title">Capacity and member failures in different domains</title>
<desc id="desc">H1 is rejected by GPU capacity screening before individual node checks. In H2, B is temporarily placed, A fails affinity and C is skipped. After rollback and exhausted search, all Pods receive gang waiting. The group identifies H1 GPU capacity and Pod A affinity within H2.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#333"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;font-size:18px;fill:#222} .heading{font-weight:600} .code{font-family:"DejaVu Sans Mono",monospace;font-size:17px} .small{font-size:16px} .blue{fill:#315a7b} .orange{fill:#985927} .muted{fill:#596777}</style>
<rect width="1200" height="950" fill="white"/>
<rect x="300" y="25" width="600" height="45" fill="#e9f0f8" stroke="#748eaa" stroke-width="1.2"/>
<text x="600.0" y="53.5" class=" blue" text-anchor="middle">Job ns/job — requires Pods A, B and C</text>
<rect x="190" y="115" width="820" height="155" fill="white" stroke="#748eaa" stroke-width="1.2"/>
<rect x="190" y="115" width="820" height="36" fill="#e9f0f8" stroke="#748eaa" stroke-width="1.2"/>
<text x="202" y="140" class="heading blue" text-anchor="start">Job HyperNode H1</text>
<rect x="220" y="170" width="760" height="75" fill="#fbf0e3" stroke="#b58b62" stroke-width="1.2"/>
<text x="600.0" y="200.5" class=" orange" text-anchor="middle">Insufficient GPU capacity</text>
<text x="600.0" y="226.5" class=" orange" text-anchor="middle">No Pod node checks in H1</text>
<rect x="190" y="320" width="820" height="155" fill="white" stroke="#748eaa" stroke-width="1.2"/>
<rect x="190" y="320" width="820" height="36" fill="#e9f0f8" stroke="#748eaa" stroke-width="1.2"/>
<text x="202" y="345" class="heading blue" text-anchor="start">Job HyperNode H2</text>
<rect x="220" y="375" width="235" height="55" fill="#f5f8fc" stroke="#8ca1b6" stroke-width="1.2"/>
<text x="337.5" y="395.5" class="" text-anchor="middle">Pod B</text>
<text x="337.5" y="421.5" class="" text-anchor="middle">Temporary allocation</text>
<rect x="480" y="375" width="235" height="55" fill="#fbf0e3" stroke="#b58b62" stroke-width="1.2"/>
<text x="597.5" y="395.5" class=" orange" text-anchor="middle">Pod A</text>
<text x="597.5" y="421.5" class=" orange" text-anchor="middle">Node affinity failure</text>
<rect x="740" y="375" width="240" height="55" fill="#ffffff" stroke="#8a98a7" stroke-width="1.2"/>
<text x="860.0" y="395.5" class="" text-anchor="middle">Pod C</text>
<text x="860.0" y="421.5" class="" text-anchor="middle">Skipped by gang</text>
<text x="220" y="460" class="muted" text-anchor="start">A is checked only within H2.</text>
<rect x="430" y="510" width="340" height="45" fill="#fbf0e3" stroke="#b58b62" stroke-width="1.2"/>
<text x="600.0" y="538.5" class=" orange" text-anchor="middle">Roll back B</text>
<rect x="300" y="595" width="600" height="60" fill="#f1f4f7" stroke="#8a98a7" stroke-width="1.2"/>
<text x="600.0" y="618.0" class="" text-anchor="middle">No remaining Job candidate</text>
<text x="600.0" y="644.0" class="" text-anchor="middle">Combine H1 capacity and H2 member blockers</text>
<rect x="70" y="700" width="1060" height="225" fill="white" stroke="#748eaa" stroke-width="1.2"/>
<rect x="70" y="700" width="1060" height="36" fill="#e9f0f8" stroke="#748eaa" stroke-width="1.2"/>
<text x="82" y="725" class="heading blue" text-anchor="start">Final JobInfo</text>
<rect x="90" y="754" width="510" height="151" fill="white" stroke="#748eaa" stroke-width="1.2"/>
<rect x="90" y="754" width="510" height="36" fill="#e9f0f8" stroke="#748eaa" stroke-width="1.2"/>
<text x="102" y="779" class="heading blue" text-anchor="start">PendingTaskDiagnostics</text>
<rect x="90" y="790" width="510" height="115" fill="#ffffff" stroke="#8a98a7" stroke-width="1.2"/>
<text x="106" y="827.5" class="code" text-anchor="start">A.Kind = PendingGangWaiting</text>
<text x="106" y="853.5" class="code" text-anchor="start">B.Kind = PendingGangWaiting</text>
<text x="106" y="879.5" class="code" text-anchor="start">C.Kind = PendingGangWaiting</text>
<rect x="620" y="754" width="490" height="151" fill="white" stroke="#b58b62" stroke-width="1.2"/>
<rect x="620" y="754" width="490" height="36" fill="#fbf0e3" stroke="#b58b62" stroke-width="1.2"/>
<text x="632" y="779" class="heading orange" text-anchor="start">GroupDiagnostic.Blockers</text>
<rect x="620" y="790" width="490" height="115" fill="#ffffff" stroke="#8a98a7" stroke-width="1.2"/>
<text x="636" y="840.5" class="code" text-anchor="start">H1: insufficient GPU capacity</text>
<text x="636" y="866.5" class="code orange" text-anchor="start">Pod A: node affinity failure in H2</text>
<path d="M600.0 70L600.0 115" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M600.0 270L600.0 320" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M600.0 475L600.0 510" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M600.0 555L600.0 595" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M600.0 655L600.0 700" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
</svg>
