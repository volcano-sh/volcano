<text x="215.0" y="588.0" class="" text-anchor="middle">Pod B</text>
<text x="215.0" y="614.0" class="" text-anchor="middle">Temporary allocation</text>
<rect x="370" y="510" width="730" height="150" fill="white" stroke="#9ca8b3" stroke-width="1.2"/>
<rect x="370" y="510" width="730" height="36" fill="#f1f3f5" stroke="#9ca8b3" stroke-width="1.2"/>
