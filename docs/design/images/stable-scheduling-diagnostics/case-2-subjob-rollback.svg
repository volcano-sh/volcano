<text x="950.0" y="632.0" class=" muted" text-anchor="middle">C: skipped by gang</text>
<path d="M650 600.0L820 600.0" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="735.0" y="591.0" class="small" text-anchor="middle">retry</text>
<rect x="430" y="375" width="340" height="45" fill="#fbf0e3" stroke="#b58b62" stroke-width="1.2"/>
<text x="600.0" y="403.5" class=" orange" text-anchor="middle">Roll back B</text>
<rect x="430" y="720" width="340" height="45" fill="#fbf0e3" stroke="#b58b62" stroke-width="1.2"/>
<text x="600.0" y="748.5" class=" orange" text-anchor="middle">Roll back B</text>
<rect x="300" y="815" width="600" height="60" fill="#f1f4f7" stroke="#8a98a7" stroke-width="1.2"/>
<text x="600.0" y="838.0" class="" text-anchor="middle">No remaining Job candidate</text>
<text x="600.0" y="864.0" class="" text-anchor="middle">Combine candidateDiagnostics from H1 and H2</text>
<rect x="70" y="925" width="1060" height="225" fill="white" stroke="#748eaa" stroke-width="1.2"/>
<rect x="70" y="925" width="1060" height="36" fill="#e9f0f8" stroke="#748eaa" stroke-width="1.2"/>
<text x="82" y="950" class="heading blue" text-anchor="start">Final JobInfo</text>
<rect x="90" y="979" width="510" height="151" fill="white" stroke="#748eaa" stroke-width="1.2"/>
<rect x="90" y="979" width="510" height="36" fill="#e9f0f8" stroke="#748eaa" stroke-width="1.2"/>
