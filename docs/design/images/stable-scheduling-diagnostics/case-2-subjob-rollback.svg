<text x="106" y="1052.5" class="code" text-anchor="start">A.Kind = PendingTaskFailure</text>
<text x="106" y="1078.5" class="code" text-anchor="start">B.Kind = PendingGangWaiting</text>
<text x="106" y="1104.5" class="code" text-anchor="start">C.Kind = PendingGangWaiting</text>
<rect x="620" y="979" width="490" height="151" fill="white" stroke="#b58b62" stroke-width="1.2"/>
<rect x="620" y="979" width="490" height="36" fill="#fbf0e3" stroke="#b58b62" stroke-width="1.2"/>
<text x="632" y="1004" class="heading orange" text-anchor="start">GroupDiagnostic.Blockers</text>
<rect x="620" y="1015" width="490" height="115" fill="#ffffff" stroke="#8a98a7" stroke-width="1.2"/>
<text x="636" y="1052.5" class="code orange" text-anchor="start">TaskID: A, Reason: NodeAffinity</text>
<text x="636" y="1078.5" class="code" text-anchor="start">HyperNodeName: one record for each</text>
<text x="636" y="1104.5" class="code" text-anchor="start">H1-a, H1-b, H2-a, H2-b</text>
