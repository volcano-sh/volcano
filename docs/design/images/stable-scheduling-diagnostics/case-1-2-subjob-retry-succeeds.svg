<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="715" viewBox="0 0 1200 715" role="img" aria-labelledby="title desc">
<title id="title">S2 succeeds in another child HyperNode</title>
<desc id="desc">Within H1, S1 places B. S2 fails in H1-a but succeeds in H1-b. The Job recovers that selected result, commits H1 and hands all Pods to binding. The discarded child failure is not published. After successful binding handoff, PendingTaskDiagnostics is nil, GroupDiagnostic is a non-nil empty GroupSchedulingDiagnostic, and the live status of A, B and C is Binding.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#333"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;font-size:18px;fill:#222} .heading{font-weight:600} .code{font-family:"DejaVu Sans Mono",monospace;font-size:17px} .small{font-size:16px} .blue{fill:#315a7b} .orange{fill:#985927} .muted{fill:#596777}</style>
<rect width="1200" height="715" fill="white"/>
<rect x="300" y="25" width="600" height="45" fill="#e9f0f8" stroke="#748eaa" stroke-width="1.2"/>
<text x="600.0" y="53.5" class=" blue" text-anchor="middle">Job ns/job — requires Pods A, B and C</text>
<rect x="70" y="110" width="1060" height="235" fill="white" stroke="#748eaa" stroke-width="1.2"/>
<rect x="70" y="110" width="1060" height="36" fill="#e9f0f8" stroke="#748eaa" stroke-width="1.2"/>
<text x="82" y="135" class="heading blue" text-anchor="start">Job HyperNode H1</text>
<rect x="100" y="165" width="230" height="150" fill="white" stroke="#9ca8b3" stroke-width="1.2"/>
<rect x="100" y="165" width="230" height="36" fill="#f1f3f5" stroke="#9ca8b3" stroke-width="1.2"/>
<text x="112" y="190" class="heading " text-anchor="start">SubJob S1</text>
<rect x="120" y="215" width="190" height="70" fill="#f5f8fc" stroke="#8ca1b6" stroke-width="1.2"/>
<text x="215.0" y="243.0" class="" text-anchor="middle">Pod B</text>
<text x="215.0" y="269.0" class="" text-anchor="middle">Temporary allocation</text>
<rect x="370" y="165" width="730" height="150" fill="white" stroke="#9ca8b3" stroke-width="1.2"/>
<rect x="370" y="165" width="730" height="36" fill="#f1f3f5" stroke="#9ca8b3" stroke-width="1.2"/>
<text x="382" y="190" class="heading " text-anchor="start">SubJob S2</text>
<rect x="390" y="215" width="260" height="80" fill="#ffffff" stroke="#8a98a7" stroke-width="1.2"/>
<text x="520.0" y="235.0" class="" text-anchor="middle">H1-a</text>
<text x="520.0" y="261.0" class=" orange" text-anchor="middle">A: node affinity failure</text>
<text x="520.0" y="287.0" class=" muted" text-anchor="middle">C: skipped by gang</text>
<rect x="820" y="215" width="260" height="80" fill="#ffffff" stroke="#8a98a7" stroke-width="1.2"/>
<text x="950.0" y="248.0" class="" text-anchor="middle">H1-b</text>
<text x="950.0" y="274.0" class="" text-anchor="middle">A and C both fit</text>
<path d="M650 255.0L820 255.0" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="735.0" y="246.0" class="small" text-anchor="middle">retry</text>
<rect x="300" y="390" width="600" height="60" fill="#e9f0f8" stroke="#748eaa" stroke-width="1.2"/>
<text x="600.0" y="413.0" class=" blue" text-anchor="middle">Recover H1-b's statement and diagnostic record</text>
<text x="600.0" y="439.0" class=" blue" text-anchor="middle">Select H1 and commit A, B and C</text>
<path d="M600.0 70L600.0 110" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M600.0 345L600.0 390" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M600.0 450L600.0 480" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="70" y="480" width="1060" height="210" fill="white" stroke="#748eaa" stroke-width="1.2"/>
<rect x="70" y="480" width="1060" height="36" fill="#e9f0f8" stroke="#748eaa" stroke-width="1.2"/>
<text x="82" y="505" class="heading blue" text-anchor="start">Final JobInfo after successful binding handoff</text>
<rect x="90" y="534" width="510" height="101" fill="white" stroke="#748eaa" stroke-width="1.2"/>
<rect x="90" y="534" width="510" height="36" fill="#e9f0f8" stroke="#748eaa" stroke-width="1.2"/>
<text x="102" y="559" class="heading blue" text-anchor="start">PendingTaskDiagnostics</text>
<rect x="90" y="570" width="510" height="65" fill="#ffffff" stroke="#8a98a7" stroke-width="1.2"/>
<text x="106" y="608.5" class="code" text-anchor="start">nil</text>
<rect x="620" y="534" width="490" height="101" fill="white" stroke="#b58b62" stroke-width="1.2"/>
<rect x="620" y="534" width="490" height="36" fill="#fbf0e3" stroke="#b58b62" stroke-width="1.2"/>
<text x="632" y="559" class="heading orange" text-anchor="start">GroupDiagnostic</text>
<rect x="620" y="570" width="490" height="65" fill="#ffffff" stroke="#8a98a7" stroke-width="1.2"/>
<text x="636" y="608.5" class="code" text-anchor="start">&amp;api.GroupSchedulingDiagnostic{}</text>
<text x="100" y="670" class="code" text-anchor="start">Tasks[A/B/C].Status = Binding</text>
</svg>
