<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
<title id="title">B satisfies the Job minimum while A remains Pending</title>
<desc id="desc">The Job requires one Pod and one ready SubJob. H1 is its only permitted domain. S2 first fails A affinity across all allowed nodes. S1 then places B, satisfying the Job minimum. The Job commits B, retains A own failure and reports group readiness.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#333"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;font-size:18px;fill:#222} .heading{font-weight:600} .code{font-family:"DejaVu Sans Mono",monospace;font-size:17px} .small{font-size:16px} .blue{fill:#315a7b} .orange{fill:#985927} .muted{fill:#596777}</style>
<rect width="1200" height="920" fill="white"/>
<rect x="300" y="25" width="600" height="45" fill="#e9f0f8" stroke="#748eaa" stroke-width="1.2"/>
<text x="600.0" y="53.5" class=" blue" text-anchor="middle">Job ns/job — requires 1 Pod and 1 ready SubJob</text>
<rect x="190" y="115" width="820" height="370" fill="white" stroke="#748eaa" stroke-width="1.2"/>
<rect x="190" y="115" width="820" height="36" fill="#e9f0f8" stroke="#748eaa" stroke-width="1.2"/>
<text x="202" y="140" class="heading blue" text-anchor="start">Job HyperNode H1</text>
<rect x="280" y="170" width="640" height="120" fill="white" stroke="#9ca8b3" stroke-width="1.2"/>
<rect x="280" y="170" width="640" height="36" fill="#f1f3f5" stroke="#9ca8b3" stroke-width="1.2"/>
<text x="292" y="195" class="heading " text-anchor="start">SubJob S2: Pod A</text>
<text x="600" y="250" class="orange" text-anchor="middle">A: node affinity failure across all permitted nodes</text>
<rect x="280" y="350" width="640" height="105" fill="white" stroke="#9ca8b3" stroke-width="1.2"/>
<rect x="280" y="350" width="640" height="36" fill="#f1f3f5" stroke="#9ca8b3" stroke-width="1.2"/>
<text x="292" y="375" class="heading " text-anchor="start">SubJob S1: Pod B</text>
<text x="600" y="425" class="blue" text-anchor="middle">B fits and satisfies the Job minimum.</text>
<path d="M600.0 290L600.0 350" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="620" y="325" class="small" text-anchor="start">evaluate S1</text>
<rect x="300" y="530" width="600" height="60" fill="#e9f0f8" stroke="#748eaa" stroke-width="1.2"/>
<text x="600.0" y="553.0" class=" blue" text-anchor="middle">Commit B</text>
<text x="600.0" y="579.0" class=" blue" text-anchor="middle">A remains Pending with its own failure</text>
<rect x="70" y="630" width="1060" height="265" fill="white" stroke="#748eaa" stroke-width="1.2"/>
<rect x="70" y="630" width="1060" height="36" fill="#e9f0f8" stroke="#748eaa" stroke-width="1.2"/>
<text x="82" y="655" class="heading blue" text-anchor="start">Final JobInfo</text>
<rect x="90" y="684" width="510" height="151" fill="white" stroke="#748eaa" stroke-width="1.2"/>
<rect x="90" y="684" width="510" height="36" fill="#e9f0f8" stroke="#748eaa" stroke-width="1.2"/>
<text x="102" y="709" class="heading blue" text-anchor="start">PendingTaskDiagnostics</text>
<rect x="90" y="720" width="510" height="115" fill="#ffffff" stroke="#8a98a7" stroke-width="1.2"/>
<text x="106" y="783.5" class="code" text-anchor="start">A.Kind = PendingTaskFailure</text>
<rect x="620" y="684" width="490" height="151" fill="white" stroke="#b58b62" stroke-width="1.2"/>
<rect x="620" y="684" width="490" height="36" fill="#fbf0e3" stroke="#b58b62" stroke-width="1.2"/>
<text x="632" y="709" class="heading orange" text-anchor="start">GroupDiagnostic.Blockers</text>
<rect x="620" y="720" width="490" height="115" fill="#ffffff" stroke="#8a98a7" stroke-width="1.2"/>
<text x="636" y="783.5" class="code" text-anchor="start">[] (empty group diagnostic)</text>
<text x="100" y="870" class="code" text-anchor="start">A: Pending | B: Binding | PodGroup: ready</text>
<path d="M600.0 70L600.0 115" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M600.0 485L600.0 530" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M600.0 590L600.0 630" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
</svg>
